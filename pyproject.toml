[project]
name = "gemini-lab-robot"
version = "0.1.0"
description = "Build a self-driving lab robot on your laptop: Gemini Robotics-ER + MuJoCo (no GPU required)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "mujoco>=3.2",
    "google-genai>=1.30",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_robot"]
